name: PulseOps AI Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-pipeline-tests:
    name: Go Telemetry & Admission Control Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go Unit Tests with Race Detector
        run: go test -v -race ./...
